[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-camp-check"
version = "0.1.0"
description = "Overnight parking & rest area rules by state — BLM 14-day rule, time limits, and what 'no camping' really means. From CarSteader."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "CarSteader", email = "hello@carsteader.com" }]
keywords = [
    "vanlife",
    "stealth-camping",
    "overnight-parking",
    "rest-area",
    "blm",
    "camping-rules",
    "legal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://carsteader.com/tools/stealth-camp-check/"
Repository = "https://github.com/wwallace603-rgb/stealth-camp-check"
"Legal Stealth Camping Guide" = "https://carsteader.com/legal-stealth-camping-usa/"
"Stealth Camping Gear List" = "https://carsteader.com/stealth-camping-gear-list/"

[project.scripts]
stealth-camp-check = "stealth_camp_check.cli:main"

[tool.setuptools]
packages = ["stealth_camp_check"]

[tool.setuptools.package-data]
stealth_camp_check = ["states.json"]
